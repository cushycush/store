vars:
  editor: nvim
  email: you@example.com

stores:
  editors:
    nvim:
      target: "~/.config/nvim"
  shells:
    targets:
      - target: "~"
        files:
          - .zshrc
          - .bashrc
      - target: "~/.config/fish"
        files:
          - config.fish
          - aliases.fish
      - target: "~/.config/nushell"
        files:
          - config.nu
    hooks:
      pre: "test -d ~/.config/fish || mkdir -p ~/.config/fish"
      post: "exec $SHELL -l"
    when:
      os: linux
  terminals:
    ghostty:
      target: "~/.config/ghostty"
    tmux:
      target: "~/.config/tmux"
  tools:
    git:
      target: "~/.config/git"
    lazygit:
      target: "~/.config/lazygit"
  work:
    target: "~/work"
    when:
      hostname: work-laptop
